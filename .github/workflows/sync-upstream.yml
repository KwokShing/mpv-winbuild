name: Sync upstream

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN (a GitHub App token) is not allowed to push changes under
          # .github/workflows. Provide a PAT with `workflow` scope as SYNC_PAT to
          # sync upstream workflow changes.
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Merge upstream
        shell: bash
        env:
          HAS_PAT: ${{ secrets.SYNC_PAT != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/zhongfly/mpv-winbuild.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Merge conflict with upstream/main, resolve it locally and push."
            exit 1
          fi
          if [[ "$HAS_PAT" != "true" ]] && ! git diff --quiet "$base" HEAD -- .github/workflows; then
            echo "::error::Upstream changes touch .github/workflows, which GITHUB_TOKEN cannot push. Add a repository secret SYNC_PAT (classic PAT with 'workflow' scope, or fine-grained PAT with Contents + Workflows write) and re-run."
            exit 1
          fi
          git push origin HEAD:main
